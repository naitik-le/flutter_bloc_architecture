name: flutter_bloc_architecture
description: "Enterprise-grade Flutter BLoC Architecture — scalable, modular, production-ready."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.29.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # ── Dependency Injection ──
  get_it: ^8.0.2

  # ── Networking ──
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # ── Local Storage ──
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5

  # ── Database (Offline) ──
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.42

  # ── Localization ──
  easy_localization: ^3.0.7

  # ── Firebase ──
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  firebase_auth: ^5.5.1

  # ── UI & Design ──
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  google_fonts: ^6.3.2

  # ── Utils ──
  connectivity_plus: ^7.0.0
  device_info_plus: ^11.5.0
  package_info_plus: ^8.1.1
  permission_handler: ^12.0.1
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  flutter_local_notifications: ^19.4.2
  path: ^1.9.1
  skeletonizer: ^2.1.3
  logger: ^2.7.0
  web_socket_channel: ^3.0.3
  stream_transform: ^2.1.1
  bloc_concurrency: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  drift_dev: ^2.22.1
  mockito: ^5.4.5
  bloc_test: ^10.0.0
  build_verify: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/lottie/
